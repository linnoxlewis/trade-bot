services: # trade-bot:  #  container_name: trade_bot_app   # build:    #  context: ../../     # dockerfile: .deploy/local/Dockerfile    #env_file:     # - .env    #networks:    #  - trade_bot_network    #ports:    #  - "5301:5301"    #  - "8080:8080"    #volumes:     # - trade_bot_data:/var/lib/trade-bot  trade-bot-db:    image: postgres:latest    container_name: trade_bot-postgresDb    environment:      - POSTGRES_USER=${DB_USER}      - POSTGRES_PASSWORD=${DB_PASSWORD}      - POSTGRES_DB=${DB_NAME}      - DATABASE_HOST=${DB_HOST}    ports:      - ${POSTGRES_PORT:-5433}:5432    volumes:      - trade_bot-postgresDb:/var/lib/postgresql/data    networks:      - trade_bot_network  trade-bot-cache:    image: "redis:alpine"    container_name: trade_bot_app_redis    environment:      - REDIS_PASSWORD=${CACHE_ADDRESS}      - REDIS_PORT=${CACHE_PASSWORD}      - REDIS_DATABASES=0    ports:    - "6379:6379"    volumes:      - /var/lib/redis/data:/root/redis    networks:      - trade_bot_networkvolumes:  trade_bot_data:  trade_bot-postgresDb:  trade-bot-cache:networks:  trade_bot_network:    name: docker_trade_bot_network